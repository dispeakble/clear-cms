name: Build Bucket

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request:
    paths: 
      - 'core/bucket/api/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-18.04

    steps:
      - uses: actions/checkout@v3
      - name: CD to bucket
        run: cd core/bucket
      - name: Build the Bucket Docker image
        run: docker build . --file Dockerfile --tag dispeakble/crm-bucket:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-bucket:$TIMESTAMP
