name: Build Bucket Api

env:
  DOCKER_IMAGE: 'dispeakble/crm-bucket:'
  WORKING_DIR: plugins/dosido/bucket

on:
  pull_request:
    paths:
      - "plugins/dosido/bucket/**"
    branches: [ master ]
    types: [opened, synchronize, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Use node js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Build the Docker image
        working-directory: ${{ env.WORKING_DIR }}
        run: docker build . --file Dockerfile --tag ${{ env.DOCKER_IMAGE }}${{ github.event.pull_request.head.sha }}
      - name: Push docker image
        run: docker push ${{ env.DOCKER_IMAGE }}${{ github.event.pull_request.head.sha }}
      - name: Echo the docker image tag
        run: echo "${{ env.DOCKER_IMAGE }}${{ github.event.pull_request.head.sha }}"
