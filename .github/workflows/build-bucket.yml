name: Build Bucket

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request_target:
    types: ['opened', 'edited', 'reopened', 'synchronize']
  pull_request:
    paths: 
      - 'core/bucket/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-18.04

    steps:
      - name: Build the Bucket Docker image
        working-directory: ./plugins/dosido/bucket
        run: docker build . --file Dockerfile --tag dispeakble/crm-bucket:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-bucket:$TIMESTAMP
