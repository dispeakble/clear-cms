name: Build Frontend

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request_target:
    types:
      - opened
  pull_request:
    paths: 
      - 'core/frontend/api/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-18.04

    steps:
      - name: Build the Frontend Docker image
        working-directory: ./core/frontend/api
        run: docker build . --file Dockerfile --tag dispeakble/crm-frontend-api:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-frontend-api:$TIMESTAMP
