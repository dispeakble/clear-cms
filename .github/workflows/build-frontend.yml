name: Build Frontend

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request:
    paths: 
      - 'core/frontend/api/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-18.04

    steps:
      - uses: actions/checkout@v3
      - name: CD to frontend
        run: cd core/frontend
      - name: Build the Frontend Docker image
        run: docker build . --file Dockerfile --tag dispeakble/crm-frontend-api:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-frontend-api:$TIMESTAMP
