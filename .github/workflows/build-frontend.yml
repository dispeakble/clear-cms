name: Build Frontend Api

env:
  DOCKER_IMAGE: 'dispeakble/crm-frontend-api'
  WORKING_DIR: core/frontend/api
  TIMESTAMP: $(date +%s)

on:
  pull_request:
    paths:
      - "core/frontend/api/**"
    branches: [ master ]
    types: [opened, synchronize, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate build ID
        id: prep
        run: |
          ts=$(date +%s)
          echo "::set-output name=BUILD_ID::${ts}"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-step1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build
        uses: docker/build-push-action@v2
        with:
          push: true
          load: false
          tags: | 
            ${{ env.DOCKER_IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ./Dockerfile
          context: .
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache