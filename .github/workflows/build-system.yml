name: Build System API

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request_target:
    types: ['opened', 'edited', 'reopened', 'synchronize']
  pull_request:
    paths: 
      - 'core/system/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Docker login
        run: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
      - name: Build the System API Docker image
        working-directory: core/system
        run: docker build . --file Dockerfile --tag dispeakble/crm-system:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-system:$TIMESTAMP
