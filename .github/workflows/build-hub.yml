name: Build Hub

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request_target:
    types: ['opened', 'edited', 'reopened', 'synchronize']
  pull_request:
    paths: 
      - 'core/hub/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Docker login
        run: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
      - name: Build the Hub Docker image
        working-directory: core/hub
        run: docker build . --file Dockerfile --tag dispeakble/crm-hub:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-hub:$TIMESTAMP
      - name: Report
        if: failure() && github.event.action != 'push'
        with: fancy/commenter@v1
          message: Some checks have failed.
