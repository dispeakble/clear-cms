name: Build Hub

env:
  DOCKER_IMAGE: 'dispeakble/crm-hub:'
  WORKING_DIR: core/hub

on:
  pull_request:
    paths:
      - core/hub/**
    branches: [ master ]
    types: [opened, synchronize, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-dir: "core/hub"
        docker-image: "dispeakble/crm-hub:$(date +%s)"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build the Docker image
        working-directory: ${{ matrix.working-dir }}
        run: docker build . --file Dockerfile --tag ${{ matrix.docker-image }}
      - name: Push docker image
        run: docker push ${{ matrix.docker-image }}
