name: Build Frontend Proxy

env:
  TIMESTAMP: $(date +%s)

on:
  pull_request_target:
    types:
      - opened
  pull_request:
    paths: 
      - 'core/frontend/proxy/api/**'
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-18.04

    steps:
      - name: Build the Frontend Proxy Docker image
        working-directory: ./core/frontend/proxy
        run: docker build . --file Dockerfile --tag dispeakble/crm-frontend-proxy:$TIMESTAMP
      - name: Push docker image
        run: docker push dispeakble/crm-frontend-proxy:$TIMESTAMP
