version: '3.7'
services:
  crm-hub:
    container_name: crm-hub
    working_dir: /usr/src/app
    build:
      context: ./hub
      dockerfile: Dockerfile
    env_file:
      - ./hub/api/.env
    networks:
      - webnet
  crm-dev:
    container_name: crm-dev
    working_dir: /usr/src/app
    build:
      context: ./dev
      dockerfile: Dockerfile
    env_file:
      - ./dev/api/.env
    networks:
      - webnet
    depends_on:
      - crm-hub
      - crm-system
      - crm-proxy
  crm-pages:
    container_name: crm-pages
    working_dir: /usr/src/app
    build:
      context: ./pages
      dockerfile: Dockerfile
    env_file:
      - ./pages/api/.env
    networks:
      - webnet
    depends_on:
      - redis
      - crm-hub
      - crm-system
  crm-system:
    container_name: crm-system
    working_dir: /usr/src/app
    build:
      context: ./system
      dockerfile: Dockerfile
    env_file:
      - ./system/api/.env
    networks:
      - webnet
    depends_on:
      - crm-hub
  crm-proxy:
    container_name: crm-proxy
    working_dir: /usr/src/app
    build:
      context: ./proxy
      dockerfile: Dockerfile
    env_file:
      - ./proxy/api/.env
    networks:
      - webnet
    ports:
      - 30443:30443
    depends_on:
      - crm-hub
      - crm-system
networks:
  webnet: