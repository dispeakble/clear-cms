  crm-system:
    container_name: crm-system
    working_dir: /usr/src/app
    build:
      context: ./system
      dockerfile: Dockerfile
    env_file:
      - ./system/api/.env
    networks:
      - webnet
    depends_on:
      - crm-hub
  crm-proxy:
    container_name: crm-proxy
    working_dir: /usr/src/app
    build:
      context: ./proxy
      dockerfile: Dockerfile
    env_file:
      - ./proxy/api/.env
    networks:
      - webnet
    ports:
      - 30443:30443
    depends_on:
      - crm-hub
      - crm-system
networks:
  webnet: