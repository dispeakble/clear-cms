  crm-hub:
    container_name: crm-hub
    working_dir: /usr/src/app
    build:
      context: ./hub
      dockerfile: Dockerfile
    env_file:
      - ./hub/api/.env
    networks:
      - webnet
  crm-dev:
    container_name: crm-dev
    working_dir: /usr/src/app
    build:
      context: ./dev
      dockerfile: Dockerfile
    env_file:
      - ./dev/api/.env
    networks:
      - webnet
    depends_on:
      - crm-hub
      - crm-system
      - crm-proxy
