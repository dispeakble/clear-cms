version: '3.7'
services:
  crm-hub:
    container_name: crm-hub
    working_dir: /usr/src/app
    build:
      context: ./hub
      dockerfile: Dockerfile
    env_file:
      - .env
  crm-dev:
    container_name: crm-dev
    working_dir: /usr/src/app
    build:
      context: ./dev
      dockerfile: Dockerfile
    env_file:
      - .env

  crm-pages:
    container_name: crm-pages
    working_dir: /usr/src/app
    build:
      context: ./pages
      dockerfile: Dockerfile
    env_file:
      - .env
  crm-system:
    container_name: crm-system
    working_dir: /usr/src/app
    build:
      context: ./system
      dockerfile: Dockerfile
    env_file:
      - .env

  crm-storage:
    container_name: crm-storage
    working_dir: /usr/src/app
    build:
      context: ./storage
      dockerfile: Dockerfile
    env_file:
      - .env
  crm-db:
    container_name: crm-db
    working_dir: /usr/src/app
    build:
      context: ./db
      dockerfile: Dockerfile
    env_file:
      - .env
  crm-proxy:
    container_name: crm-proxy
    working_dir: /usr/src/app
    build:
      context: ./proxy
      dockerfile: Dockerfile
    env_file:
      - .env
