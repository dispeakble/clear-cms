version: '3.3'
services:
  crm-hub:
    container_name: crm-hub
    working_dir: /usr/src/app
    build:
      context: ./core/hub
      dockerfile: Dockerfile
    image:
      dispeakble/crm-hub:${CRM_IMG_TAG}
  crm-db:
    container_name: crm-db
    working_dir: /usr/src/app
    build:
      context: ./plugins/dosido/db
      dockerfile: Dockerfile
    image:
      dispeakble/crm-db:${CRM_IMG_TAG}
  crm-bucket:
    container_name: crm-bucket
    working_dir: /usr/src/app
    build:
      context: ./plugins/dosido/bucket
      dockerfile: Dockerfile
    image:
      dispeakble/crm-bucket:${CRM_IMG_TAG}
  crm-frontend-api:
    container_name: crm-frontend-api
    working_dir: /usr/src/app
    build:
      context: ./core/frontend/api
      dockerfile: Dockerfile
    image:
      dispeakble/crm-frontend-api:${CRM_IMG_TAG}
  crm-frontend-proxy:
    container_name: crm-frontend-proxy
    working_dir: /usr/src/app
    build:
      context: ./core/frontend/proxy
      dockerfile: Dockerfile
    image:
      dispeakble/crm-frontend-proxy:${CRM_IMG_TAG}
  crm-system:
    container_name: crm-system
    working_dir: /usr/src/app
    build:
      context: ./core/system
      dockerfile: Dockerfile
    image:
      dispeakble/crm-system:${CRM_IMG_TAG}
  crm-proxy:
    container_name: crm-proxy
    working_dir: /usr/src/api
    build:
      context: ./core/proxy
      dockerfile: Dockerfile
    image:
      dispeakble/crm-proxy:${CRM_IMG_TAG}
